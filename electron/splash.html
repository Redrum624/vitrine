<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine</title>
    <style>
        /* Safelight design tokens — mirrors src/index.css :root (this file is standalone
           in the splash BrowserWindow and cannot import the app stylesheet). */
        :root {
            --vt-chrome: #19191b;
            --vt-line: #2d2d32;
            --vt-text: #ececef;
            --vt-text-2: #b4b4bb;
            --vt-text-3: #8c8c94;
            --accent: #f0a640;
            --font-ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            --font-mono: "Cascadia Mono", ui-monospace, Consolas, monospace;
            --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--vt-chrome);
            /* The window is frameless: this hairline is its only edge. */
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07);
            font-family: var(--font-ui);
            color: var(--vt-text);
            overflow: hidden;
            cursor: default;
            -webkit-user-select: none;
            user-select: none;
            animation: fadeIn 160ms var(--ease-out) both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            body { animation: none; }
            .progress-bar { transition: none; }
        }

        .brand {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 18px;
        }

        .logo-title {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.2px;
            margin-top: 20px;
        }

        .logo-subtitle {
            font-size: 12.5px;
            color: var(--vt-text-3);
            margin-top: 5px;
        }

        .loading-section {
            padding: 0 28px 22px;
        }

        .status-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 9px;
        }

        .status-text {
            color: var(--vt-text-2);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-percentage,
        .version {
            color: var(--vt-text-3);
            font-family: var(--font-mono);
            font-size: 11px;
            font-variant-numeric: tabular-nums;
        }

        .progress-bar-container {
            width: 100%;
            height: 2px;
            background: var(--vt-line);
            border-radius: 1px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 1px;
            transition: width 300ms var(--ease-out);
        }

        .version {
            margin-top: 10px;
            text-align: right;
        }

        .error-message {
            color: #f87171;
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="brand">
        <svg viewBox="0 0 256 256" width="72" height="72">
            <defs>
                <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#1a1a1a"/>
                    <stop offset="100%" style="stop-color:#0d0d0d"/>
                </linearGradient>
                <linearGradient id="bladeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#b0b0b0"/>
                    <stop offset="100%" style="stop-color:#505050"/>
                </linearGradient>
            </defs>
            <rect x="0" y="0" width="256" height="256" rx="40" ry="40" fill="url(#bgGradient)"/>
            <circle cx="128" cy="128" r="93" fill="none" stroke="#454545" stroke-width="5"/>
            <circle cx="128" cy="128" r="85" fill="#0a0a0a"/>
            <g fill="url(#bladeGradient)" stroke="#252525" stroke-width="1">
                <path d="M98,46 A85,85 0 0,1 158,46 L128,75 L98,105 Z"/>
                <path d="M98,46 A85,85 0 0,1 158,46 L128,75 L98,105 Z" transform="rotate(45, 128, 128)"/>
                <path d="M98,46 A85,85 0 0,1 158,46 L128,75 L98,105 Z" transform="rotate(90, 128, 128)"/>
                <path d="M98,46 A85,85 0 0,1 158,46 L128,75 L98,105 Z" transform="rotate(135, 128, 128)"/>
                <path d="M98,46 A85,85 0 0,1 158,46 L128,75 L98,105 Z" transform="rotate(180, 128, 128)"/>
                <path d="M98,46 A85,85 0 0,1 158,46 L128,75 L98,105 Z" transform="rotate(225, 128, 128)"/>
                <path d="M98,46 A85,85 0 0,1 158,46 L128,75 L98,105 Z" transform="rotate(270, 128, 128)"/>
                <path d="M98,46 A85,85 0 0,1 158,46 L128,75 L98,105 Z" transform="rotate(315, 128, 128)"/>
            </g>
            <circle cx="128" cy="128" r="25" fill="#0a0a0a"/>
        </svg>
        <div class="logo-title">Vitrine</div>
        <div class="logo-subtitle">The darkroom, behind glass.</div>
    </div>

    <div class="loading-section">
        <div class="status-row">
            <div class="status-text" id="status-message">Initializing...</div>
            <div class="progress-percentage" id="progress-percentage">0%</div>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="error-message" id="error-message"></div>
        <div class="version" id="version">&nbsp;</div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progress-bar');
            const progressPercentage = document.getElementById('progress-percentage');
            const statusMessage = document.getElementById('status-message');
            const errorMessage = document.getElementById('error-message');
            const versionElement = document.getElementById('version');

            // Load version from Electron API
            if (window.electronAPI?.getAppVersion) {
                window.electronAPI.getAppVersion().then(version => {
                    versionElement.textContent = `v${version}`;
                }).catch(() => { /* leave it blank rather than show a made-up version */ });
            }

            // Handle progress updates from main process
            if (window.electronAPI?.onSplashProgress) {
                window.electronAPI.onSplashProgress((data) => {
                    const { progress, message, error } = data;

                    if (error) {
                        errorMessage.textContent = error;
                        errorMessage.classList.add('show');
                        return;
                    }

                    if (message) {
                        statusMessage.textContent = message;
                    }

                    if (progress !== undefined) {
                        const percentage = Math.min(100, Math.max(0, progress));
                        progressBar.style.width = percentage + '%';
                        progressPercentage.textContent = Math.round(percentage) + '%';
                    }
                });
            }

            // Fallback: simulate initial progress if no updates
            let fallbackProgress = 0;
            const messages = [
                'Initializing...',
                'Loading modules...',
                'Preparing workspace...'
            ];
            let msgIndex = 0;

            const fallbackInterval = setInterval(() => {
                if (fallbackProgress < 30) {
                    fallbackProgress += Math.random() * 5;
                    progressBar.style.width = fallbackProgress + '%';
                    progressPercentage.textContent = Math.round(fallbackProgress) + '%';

                    if (fallbackProgress > msgIndex * 10 && msgIndex < messages.length) {
                        statusMessage.textContent = messages[msgIndex];
                        msgIndex++;
                    }
                }
            }, 200);

            // Clear fallback when we receive real updates
            let realUpdatesReceived = false;
            if (window.electronAPI?.onSplashProgress) {
                window.electronAPI.onSplashProgress(() => {
                    if (!realUpdatesReceived) {
                        realUpdatesReceived = true;
                        clearInterval(fallbackInterval);
                    }
                });
            }
        });
    </script>
</body>
</html>
