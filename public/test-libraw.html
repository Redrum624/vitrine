<!DOCTYPE html>
<html>
<head>
  <title>LibRaw WASM Test</title>
  <style>
    body { background: #111; color: #ccc; font-family: monospace; padding: 20px; font-size: 13px; }
    .pass { color: #4ade80; } .fail { color: #f87171; } .warn { color: #fbbf24; }
    pre { white-space: pre-wrap; }
    button { padding: 8px 16px; margin: 8px 4px; cursor: pointer; font-size: 14px; }
    canvas { border: 1px solid #333; margin: 8px 0; display: block; }
    #log { max-height: 60vh; overflow-y: auto; }
  </style>
</head>
<body>
  <h2>LibRaw WASM — Multi-file Test</h2>
  <p>Pick several RAW files (ORF, DNG, CR2, etc.) and they will be processed sequentially.</p>
  <input type="file" id="picker" multiple accept=".orf,.dng,.cr2,.nef,.arw,.rw2,.pef,.raf" />
  <button onclick="runTest()">Process Files</button>
  <div id="log"></div>
  <div id="previews"></div>

<script type="module">
// Load LibRaw via Vite's module resolver
await import('/src/test-libraw-entry.ts');
const LibRaw = window.LibRaw;

window.LibRaw = LibRaw;

const log = document.getElementById('log');
const previews = document.getElementById('previews');

function out(msg, cls) {
  const line = document.createElement('div');
  line.className = cls || '';
  line.textContent = msg;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
  console.log(msg);
}

function showPreview(label, data, w, h, channels) {
  const canvas = document.createElement('canvas');
  canvas.width = Math.min(w, 800);
  canvas.height = Math.round(canvas.width * h / w);
  const ctx = canvas.getContext('2d');

  // Scale down for preview
  const scaleW = canvas.width;
  const scaleH = canvas.height;
  const imgData = ctx.createImageData(scaleW, scaleH);
  const xR = w / scaleW, yR = h / scaleH;

  for (let y = 0; y < scaleH; y++) {
    for (let x = 0; x < scaleW; x++) {
      const sx = Math.floor(x * xR), sy = Math.floor(y * yR);
      const si = (sy * w + sx) * channels;
      const di = (y * scaleW + x) * 4;
      imgData.data[di]     = data[si];
      imgData.data[di + 1] = data[si + 1];
      imgData.data[di + 2] = data[si + 2];
      imgData.data[di + 3] = 255;
    }
  }
  ctx.putImageData(imgData, 0, 0);

  const title = document.createElement('div');
  title.textContent = label;
  title.style.fontWeight = 'bold';
  previews.appendChild(title);
  previews.appendChild(canvas);
}

window.runTest = async function() {
  const files = document.getElementById('picker').files;
  if (!files.length) { out('No files selected', 'fail'); return; }

  log.innerHTML = '';
  previews.innerHTML = '';
  out(`Testing ${files.length} file(s)...`);

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    out(`\n${'='.repeat(50)}`);
    out(`[${i+1}/${files.length}] ${file.name} (${(file.size/1024/1024).toFixed(1)} MB)`);

    try {
      const buffer = await file.arrayBuffer();
      const uint8 = new Uint8Array(buffer);

      out(`  Creating LibRaw instance...`);
      const raw = new LibRaw();

      out(`  open()...`);
      const t0 = performance.now();
      await raw.open(uint8, {
        userQual: 3,
        useCameraWb: true,
        outputBps: 8,
        outputColor: 1,
      });
      out(`  open() done in ${(performance.now()-t0).toFixed(0)}ms`);

      out(`  metadata()...`);
      const meta = await raw.metadata();
      out(`  ${meta.width}x${meta.height} — ${meta.make||'?'} ${meta.model||'?'}, ISO ${meta.iso||'?'}`);

      out(`  imageData()...`);
      const t2 = performance.now();
      const imgData = await raw.imageData();
      const elapsed = (performance.now()-t2).toFixed(0);

      if (!imgData) {
        out(`  imageData() returned ${imgData} (${typeof imgData}) after ${elapsed}ms`, 'fail');
        continue;
      }

      const isUint8 = imgData instanceof Uint8Array;
      const isView = ArrayBuffer.isView(imgData);
      const len = imgData.length ?? imgData.byteLength ?? (typeof imgData === 'object' ? Object.keys(imgData).length : 0);

      out(`  imageData() returned in ${elapsed}ms:`);
      out(`    type=${typeof imgData}, constructor=${imgData?.constructor?.name}, Uint8Array=${isUint8}, ArrayBufferView=${isView}, length=${len}`);

      if (typeof imgData === 'object' && !isUint8 && !isView) {
        const keys = Object.keys(imgData);
        out(`    Object keys: ${keys.length} (first 5: ${keys.slice(0,5).join(',')})`, 'warn');

        // Try to reconstruct
        if (keys.length > 1000 && keys.every(k => /^\d+$/.test(k))) {
          out(`    Looks like a serialised typed array with ${keys.length} numeric keys`, 'warn');
          const arr = new Uint8Array(keys.length);
          for (let j = 0; j < keys.length; j++) arr[j] = imgData[j];
          out(`    Reconstructed ${arr.length} bytes`, 'pass');
          showPreview(`${file.name} (reconstructed)`, arr, meta.width, meta.height, 3);
          continue;
        }
      }

      const expectedRGB = meta.width * meta.height * 3;
      const expectedRGBA = meta.width * meta.height * 4;

      if (isUint8 && (len === expectedRGB || len === expectedRGBA)) {
        const ch = len === expectedRGBA ? 4 : 3;
        out(`  ✅ Got ${ch === 3 ? 'RGB' : 'RGBA'} data: ${len} bytes`, 'pass');
        showPreview(`${file.name}`, imgData, meta.width, meta.height, ch);
      } else if (len > 0) {
        out(`  ⚠️ Got data but unexpected length: ${len} (expected RGB=${expectedRGB} or RGBA=${expectedRGBA})`, 'warn');
        // Try showing it anyway
        const ch = len >= expectedRGBA ? 4 : 3;
        if (isUint8 || isView) {
          showPreview(`${file.name} (unexpected len)`, isUint8 ? imgData : new Uint8Array(imgData.buffer), meta.width, meta.height, ch);
        }
      } else {
        out(`  ❌ No usable pixel data`, 'fail');
      }

    } catch (err) {
      out(`  ❌ ${err.message}`, 'fail');
    }
  }

  out(`\n✅ Done`);
};
</script>
</body>
</html>
